<script>
(() => {
  const root = document.getElementById('kiseki-v4');

  const top = (title, back = 'home', more = false) => `<div class="kv-top"><button type="button" data-go="${back}" aria-label="返回">‹</button><strong>${title}</strong>${more ? '<button type="button" class="kv-small" data-sheet="more" aria-label="作品选项">•••</button>' : '<span style="width:36px"></span>'}</div>`;

  const footer = (label, target) => `<div class="kv-footer"><button type="button" class="kv-primary" data-go="${target}">${label}</button></div>`;

      'photo-actions': `<p>照片只从这篇日记移除，不会删除系统图库的原件。拖动后的顺序就是最终播放顺序。</p><button type="button" class="kv-search-result" data-go="picker">继续从图库添加</button><button type="button" class="kv-search-result" data-action="sort-shot">按拍摄时间重新排列</button><button type="button" class="kv-search-result" data-action="sort-reverse">倒序排列</button>`,
      'still-photo': `<p>选择要按当前画面风格导出的照片。</p><div class="kv-still-grid">${state.selected.map(i => `<button type="button" data-still="${i}" aria-label="选择${names[i]}">${shot(i)}</button>`).join('')}</div>`,
      model: `<p>歌词识别模型是可选下载，不随 App 安装；需要时再下载，也可删除。</p><div class="kv-row"><span>状态</span><span>${state.model ? '已安装' : '未安装'}</span></div><div class="kv-row"><span>预计占用</span><span>以实际模型文件为准</span></div><button type="button" class="kv-primary" data-action="model">${state.model ? '移除模型' : '模拟下载模型'}</button>`,
      storage: `<p>独立 App 会在本机保留草稿素材和已完成作品。</p><div class="kv-row"><span>作品素材</span><span>由实际照片决定</span></div><div class="kv-row"><span>临时渲染文件</span><span>制作后可清理</span></div><button type="button" class="kv-secondary" data-action="clean">清理临时文件</button><button type="button" class="kv-secondary" data-action="backup" style="margin-top:8px">导出作品草稿备份</button>`,
      'result-actions': `<button type="button" class="kv-search-result" data-action="save">保存到照片</button><button type="button" class="kv-search-result" data-action="share">分享</button><button type="button" class="kv-search-result" data-action="rename">重命名这个版本</button><button type="button" class="kv-search-result" data-action="delete-result">删除这个版本</button>`,
      'caption-consent': `<p>${state.pendingCaption === 'batch' ? '将为尚无旁白的照片生成文字，已修改的句子会保留。' : state.captions[state.active] ? '重新生成会替换这张照片现有的旁白。' : '将为这张照片生成一句旁白。'}</p><p>会把缩小后的照片预览发送给图片旁白服务；原图不会上传。</p><button type="button" class="kv-primary" data-action="confirm-caption">确认生成</button>`,
      'delete-result-confirm': `<p>只删除这个导出版本；作品草稿和照片仍会保留。</p><button type="button" class="kv-primary" data-action="confirm-delete-result">删除这个版本</button>`,
      more: `<button type="button" class="kv-search-result" data-go="home">保存草稿，返回作品</button><button type="button" class="kv-search-result" data-go="settings">设置与存储</button><button type="button" class="kv-search-result" data-sheet="captions">管理全部旁白</button>`,
      'remove-photo': `<p>只从“海风与日光”移除这张照片，系统图库中的原件仍在。</p><button type="button" class="kv-primary" data-action="remove-photo">从作品移除</button>`,
      'clear-captions': `<p>将清空本作品的全部图片旁白；照片与已完成的作品不会删除。</p><button type="button" class="kv-primary" data-action="confirm-clear-captions">清空全部旁白</button>`,
    };
    return `<div class="kv-overlay"><div class="kv-sheet"><div class="kv-handle"></div><div class="kv-sheethead"><strong>${({photo: '这张照片', captions: '图片旁白', key: 'API Key', music: '在线搜歌', 'music-confirm': '确认歌曲', lyrics: '找歌词', 'lyric-preview': '校对歌词', file: '导入音乐', template: '呈现方式', filter: '色彩', text: '文字与展签', advanced: '节奏与片头', 'photo-actions': '管理照片', 'still-photo': '选择照片', model: '本机识别', storage: '存储与备份', 'result-actions': '这个作品', more: '作品选项', 'remove-photo': '移除照片', 'clear-captions': '清空旁白', 'caption-consent': '生成图片旁白', 'delete-result-confirm': '删除版本'})[state.sheet]}</strong><button type="button" data-action="close-sheet">完成</button></div>${bodies[state.sheet]}</div></div>`;
  }
  function render() {
    if (state.page === 'resume') state.page = state.lastEditor;
    view.innerHTML = screens[state.page]();
    root.querySelector('.kv-overlay')?.remove();
    if (state.sheet) root.querySelector('.kv-phone').insertAdjacentHTML('beforeend', sheet());
  }
  function go(page) {
    state.sheet = null;
    if (page === 'resume') page = state.lastEditor;
    if (page === 'render') page = 'preflight';
    if (screens[page]) {
      state.page = page;
      if (['photos', 'audio', 'look', 'preview'].includes(page)) state.lastEditor = page;
      if (page === 'render' && state.progress === 0) state.progress = 6;
      render();
    }
  }
  let drag = null;
  root.addEventListener('pointerdown', event => {
    const card = event.target.closest('[data-photo]');
    if (!card) return;
    drag = {id: Number(card.dataset.photo), card, x: event.clientX, y: event.clientY, moved: false};
    card.setPointerCapture(event.pointerId);
  });
  root.addEventListener('pointermove', event => {
    if (!drag) return;
    if (Math.abs(event.clientX - drag.x) > 8 || Math.abs(event.clientY - drag.y) > 8) {
      drag.moved = true;
      drag.card.classList.add('dragging');
      drag.card.style.transform = `translate(${event.clientX - drag.x}px, ${event.clientY - drag.y}px) scale(1.04)`;
    }
  });
  root.addEventListener('pointerup', event => {
    if (!drag) return;
    const previous = drag;
    drag = null;
    previous.card.style.pointerEvents = 'none';
    const target = document.elementFromPoint(event.clientX, event.clientY)?.closest('[data-photo]');
    previous.card.style.pointerEvents = '';
    previous.card.style.transform = '';
    if (previous.moved && target) {
      const from = state.selected.indexOf(previous.id);
      const to = state.selected.indexOf(Number(target.dataset.photo));
      if (from >= 0 && to >= 0 && from !== to) {
        state.selected.splice(from, 1);
        state.selected.splice(to, 0, previous.id);
      }
      render();
    } else if (!previous.moved) {
      state.active = previous.id;
      state.sheet = 'photo';
      render();
    } else render();
  });
  root.addEventListener('pointercancel', () => {
    if (!drag) return;
    drag.card.style.transform = '';
    drag = null;
    render();
  });
  root.addEventListener('input', event => {
    if (event.target.dataset.range === 'intensity') {
      state.intensity = Number(event.target.value);
      const label = root.querySelector('.kv-sheet .kv-label');
      if (label) label.firstChild.textContent = `强度 · ${state.intensity}%`;
    }
  });
  root.addEventListener('click', event => {
    const button = event.target.closest('button');
    if (!button || !root.contains(button) || button.dataset.photo !== undefined) return;
    if (button.dataset.go) return go(button.dataset.go);
    if (button.dataset.sheet) {state.sheet = button.dataset.sheet; return render();}
    if (button.dataset.select !== undefined) {
      const index = Number(button.dataset.select);
      const at = state.selected.indexOf(index);
      at < 0 ? state.selected.push(index) : state.selected.splice(at, 1);
      return render();
    }
    if (button.dataset.still !== undefined) {state.active = Number(button.dataset.still); state.sheet = null; return render();}
    if (button.dataset.music) {state.music = button.dataset.music; return render();}
    if (button.dataset.format) {state.format = button.dataset.format; return render();}
    if (button.dataset.output) {state.output = button.dataset.output; return render();}
    if (button.dataset.resultTab) {state.resultTab = button.dataset.resultTab; return render();}
    if (button.dataset.template) {state.template = button.dataset.template; state.sheet = null; return render();}
    if (button.dataset.filter) {state.filter = button.dataset.filter; return render();}
    if (button.dataset.lyricsMode) {state.lyricsMode = button.dataset.lyricsMode; return render();}
    if (button.dataset.duration) {state.duration = button.dataset.duration; return render();}
    if (button.dataset.toggle) {state[button.dataset.toggle] = !state[button.dataset.toggle]; return render();}
    if (button.dataset.offset) {state.lyricOffset += Number(button.dataset.offset); return render();}
    const action = button.dataset.action;
    if (!action) return;
    if (action === 'toggle-space') state.spaceReady = !state.spaceReady;
    if (action === 'start-render' && state.spaceReady) {state.page = 'render'; state.progress = 6;}
    if (action === 'status-recheck') state.sheet = null;
    if (action === 'play') state.playing = !state.playing;
    if (action === 'progress') state.progress >= 100 ? go('result') : state.progress = Math.min(100, state.progress + 34);
    if (action === 'cancel') {state.progress = 0; go('preview');}
    if (action === 'save') {state.saved = true; state.sheet = null;}
    if (action === 'share' || action === 'clean' || action === 'backup' || action === 'rename') state.sheet = null;
    if (action === 'generate' || action === 'batch-caption') {
      state.pendingCaption = action === 'generate' ? 'single' : 'batch';
      state.sheet = 'caption-consent';
    }
    if (action === 'confirm-caption') {
      if (!state.key) {state.keyFromCaption = true; state.sheet = 'key';}
      else {
        if (state.pendingCaption === 'single') state.captions[state.active] = '那天的风，刚好经过。';
        else state.selected.forEach(i => {if (!state.captions[i]) state.captions[i] = '这一刻，刚好留了下来。';});
        state.sheet = state.pendingCaption === 'single' ? 'photo' : 'captions';
        state.pendingCaption = null;
      }
    }
    if (action === 'save-caption') {state.captions[state.active] = root.querySelector('#kv-caption')?.value.trim() || ''; state.sheet = null;}
    if (action === 'delete-caption') {delete state.captions[state.active]; state.sheet = 'photo';}
    if (action === 'set-key') {state.key = true; state.sheet = state.keyFromCaption ? 'caption-consent' : null; state.keyFromCaption = false;}
    if (action === 'remove-key') {state.key = false; state.sheet = null;}
    if (action === 'choose-music') {state.music = 'online'; state.sheet = null;}
    if (action === 'choose-file') {state.music = 'local'; state.sheet = null;}
    if (action === 'choose-lyrics') {state.lyrics = true; state.sheet = null;}
    if (action === 'photo-still') {state.output = 'still'; go('preview');}
    if (action === 'ask-remove') state.sheet = 'remove-photo';
    if (action === 'remove-photo') {state.selected = state.selected.filter(i => i !== state.active); state.active = state.selected[0] ?? 0; state.sheet = null;}
    if (action === 'open-photo') state.sheet = 'photo';
    if (action === 'clear-captions') state.sheet = 'clear-captions';
    if (action === 'confirm-clear-captions') {state.captions = {}; state.sheet = null;}
    if (action === 'model') state.model = !state.model;
    if (action === 'sort-shot') {state.selected.sort((a, b) => a - b); state.sheet = null;}
    if (action === 'sort-reverse') {state.selected.reverse(); state.sheet = null;}
    if (action === 'save-text') {state.signature = root.querySelector('#kv-signature')?.value || ''; state.outro = root.querySelector('#kv-outro')?.value || ''; state.sheet = null;}
    if (action === 'delete-result') state.sheet = 'delete-result-confirm';
    if (action === 'confirm-delete-result') state.sheet = null;
    if (action === 'close-sheet') {state.sheet = null; state.keyFromCaption = false;}
    render();
  });
  render();
})();
</script>
