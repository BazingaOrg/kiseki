[package]
name = "kiseki-desktop"
version = "0.1.0"
edition = "2021"
description = "kiseki desktop shell"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
